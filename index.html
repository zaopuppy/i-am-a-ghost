<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090d" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2226%22 font-size=%2228%22>👻</text></svg>" />
    <title>I Am a Ghost</title>
  </head>
  <body>
    <main id="app" aria-label="I Am a Ghost">
      <canvas id="game-canvas" aria-label="Three.js game canvas" tabindex="0"></canvas>
      <section class="lobby-panel" data-testid="lobby-panel">
        <p class="eyebrow">局域网捉迷藏</p>
        <h1>I AM A GHOST</h1>
        <p class="connection" data-connected="false">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="network-status" data-testid="network-status">连接房间服务…</span>
        </p>
        <div class="lobby-actions" id="lobby-actions">
          <button id="create-room" data-testid="create-room">创建房间</button>
          <div class="join-row">
            <label class="sr-only" for="room-code-input">房间码</label>
            <input id="room-code-input" data-testid="room-code-input" maxlength="6" autocomplete="off" placeholder="输入 6 位房间码" />
            <button id="join-room" data-testid="join-room">加入</button>
          </div>
        </div>
        <div class="room-panel" id="room-panel" hidden>
          <p class="room-label">房间码</p>
          <p class="room-code" id="room-code" data-testid="room-code">——</p>
          <ul class="roster" id="roster" data-testid="roster"></ul>
          <button id="start-match" data-testid="start-match" hidden>开始游戏</button>
          <p class="waiting" id="waiting-message">等待房主开始…</p>
        </div>
        <p class="error-message" id="error-message" role="alert"></p>
      </section>
      <section class="m2-hud" id="game-hud" hidden>
        <div class="hud-role-block">
          <p id="role-label" data-testid="role-label"></p>
          <p class="control-hint" id="control-hint">WASD 或方向键移动 · 根据角色显示操作</p>
        </div>
        <div class="hud-objective">
          <p class="hud-kicker" id="objective-label">撑过这栋房子</p>
          <p class="hud-timer" id="match-timer" data-testid="match-timer">05:00</p>
          <div class="health-track" aria-label="鬼的生命值">
            <span class="health-fill" id="ghost-health-fill"></span>
          </div>
          <p class="hud-health-label">鬼 <span id="ghost-health-value">100</span></p>
        </div>
        <div class="hud-captures" aria-label="抓取次数">
          <span class="capture-mark"></span><span class="capture-mark"></span><span class="capture-mark"></span>
        </div>
        <p class="hud-fps" id="hud-fps" data-testid="hud-fps" aria-label="帧率">0 FPS</p>
        <div class="battery-meter" id="battery-meter">
          <span class="battery-icon" aria-hidden="true"></span>
          <span class="battery-track"><span id="battery-fill"></span></span>
        </div>
        <div
          class="battery-locator"
          id="battery-locator"
          data-testid="battery-locator"
          role="img"
          hidden
        >
          <span class="battery-bearing" aria-hidden="true"></span>
          <span class="battery-locator-copy">
            <span>备用电池</span>
            <strong id="battery-distance">--m</strong>
          </span>
        </div>
      </section>
      <section class="touch-controls" id="touch-controls" aria-label="触控操作" hidden>
        <div
          class="touch-joystick"
          id="touch-joystick"
          role="application"
          aria-label="移动摇杆"
        >
          <span class="touch-joystick__cross" aria-hidden="true"></span>
          <span class="touch-joystick__knob" id="touch-joystick-knob" aria-hidden="true"></span>
        </div>
        <button class="touch-action" id="touch-action" type="button" aria-label="按住打开手电">
          <span class="touch-action__beam" aria-hidden="true"></span>
          <span>手电</span>
        </button>
      </section>
      <p class="event-banner" id="event-banner" data-testid="event-banner" hidden></p>
      <button class="audio-toggle" id="audio-toggle" type="button" aria-label="切换声音">声音：开</button>
      <section class="result-overlay" id="result-overlay" data-testid="result-overlay" hidden>
        <div class="result-card">
          <p class="eyebrow">本局结束</p>
          <h2 id="result-title">孩子获胜</h2>
          <p id="result-detail">黑暗暂时退去了。</p>
          <button id="ready-next" data-testid="ready-next">准备下一局</button>
          <p class="ready-count" id="ready-count">0 / 0 已准备</p>
        </div>
      </section>
      <p class="milestone" id="milestone">M6 · 局域网试玩版</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
